# Publishes the package to npm when main carries a version npm does not have yet.
# The files at the repository root are generated by GS2 Studio's `npm run build:dsl-types -- --out <this checkout>`;
# edit them there, not here.
version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:26.8.2

jobs:
  verify:
    executor: node
    steps:
      - checkout
      # The declarations must compile on their own: they are the whole package.
      - run:
          name: Type-check the declarations
          command: npx --yes -p typescript@5.9.3 tsc --noEmit --strict --target es2022 --module nodenext --moduleResolution nodenext index.d.ts gs2.d.ts raw.d.ts
      # npm packs whatever is present, so a missing LICENSE would publish silently without one.
      - run:
          name: Check the packed file list
          command: |
            test -f LICENSE
            npm pack --dry-run

  publish:
    executor: node
    steps:
      - checkout
      - run:
          name: Publish a version npm does not have yet
          command: |
            name=$(node -p "require('./package.json').name")
            version=$(node -p "require('./package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm; nothing to publish."
              exit 0
            fi
            # npm trusted publishing exchanges this CircleCI OIDC token for a one-time publish credential (npm 11.5.1+).
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            npx --yes npm@11.6.2 publish --access public

workflows:
  publish:
    jobs:
      - verify
      - publish:
          requires: [verify]
          filters:
            branches:
              only: main
