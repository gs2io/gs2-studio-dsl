# Publishes the package to npm when main carries a version npm does not have yet.
# The files at the repository root are generated by GS2 Studio's `npm run build:dsl-types -- --out <this checkout>`;
# edit them there, not here.
name: publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # The declarations must compile on their own: they are the whole package.
      - name: Type-check the declarations
        run: npx --yes -p typescript@5.9.3 tsc --noEmit --strict --target es2022 --module nodenext --moduleResolution nodenext index.d.ts gs2.d.ts raw.d.ts
      # npm packs whatever is present, so a missing LICENSE would publish silently without one.
      - name: Check the packed file list
        run: |
          test -f LICENSE
          npm pack --dry-run

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing exchanges this OIDC token for a one-time publish credential.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.6.2
      - name: Skip a version npm already has
        id: published
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm; nothing to publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.already == 'false'
        run: npm publish --access public --provenance
